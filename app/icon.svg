<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffd9a0" stop-opacity="0.7"/>
      <stop offset="55%"  stop-color="#C77B3C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C77B3C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ocre-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F4B57A"/>
      <stop offset="55%"  stop-color="#E29A5A"/>
      <stop offset="100%" stop-color="#C77B3C"/>
    </linearGradient>
  </defs>

  <!-- Fond rond -->
  <rect width="64" height="64" fill="url(#bg)" rx="14"/>
  <!-- Halo radial doré -->
  <circle cx="32" cy="32" r="28" fill="url(#halo)"/>

  <!-- Étoile à 8 branches - état statique, toujours visible -->
  <g transform="translate(32 32)">
    <path
      d="M 0 -23 L 5 -7 L 17 -17 L 7 -5 L 23 0 L 7 5 L 17 17 L 5 7 L 0 23 L -5 7 L -17 17 L -7 5 L -23 0 L -7 -5 L -17 -17 L -5 -7 Z"
      fill="url(#ocre-grad)"
      stroke="#5a3215"
      stroke-width="0.4"
      stroke-linejoin="round"
    />

    <!-- Surcouche de tracé animé : un fil blanc qui parcourt l'étoile puis s'estompe -->
    <path
      d="M 0 -23 L 5 -7 L 17 -17 L 7 -5 L 23 0 L 7 5 L 17 17 L 5 7 L 0 23 L -5 7 L -17 17 L -7 5 L -23 0 L -7 -5 L -17 -17 L -5 -7 Z"
      fill="none"
      stroke="#fff8e1"
      stroke-width="1.4"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-dasharray="240"
      stroke-dashoffset="240"
      opacity="0">
      <animate attributeName="opacity"
               values="0;1;1;0"
               keyTimes="0;0.05;0.85;1"
               dur="2.4s"
               fill="freeze"/>
      <animate attributeName="stroke-dashoffset"
               from="240" to="0"
               dur="2s" begin="0.1s"
               fill="freeze"
               calcMode="spline"
               keySplines="0.22 1 0.36 1"/>
    </path>

    <!-- Point central éclatant -->
    <circle cx="0" cy="0" r="2.2" fill="#fff8e1"/>
  </g>
</svg>
